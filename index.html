<!DOCTYPE html>
<html lang="ja" style="color-scheme:dark;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#14161b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>すたろぐ Study Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c0e; --surface:#141619; --surface2:#1d2024; --ink:#e7e8ea; --muted:#858a92; --line:#2c3035;
  --all:#777d86;
  --hourA:#121416; --hourB:#181b1f;
  --r:18px; --rs:10px;
  --shadow:0 4px 16px rgba(0,0,0,.28);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0;}
html,body{overflow-x:hidden; overscroll-behavior-x:none; touch-action:pan-y;}
body{margin:0; background:var(--bg); font-family:'Noto Sans JP',sans-serif; color:var(--ink);}
.app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:82px; overflow-x:hidden;}
h1,h2,h3{font-family:'Zen Maru Gothic',sans-serif; margin:0;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:var(--ink); flex-shrink:0;}
input,select,textarea{font-family:inherit; background:var(--surface2); color:var(--ink); border:1px solid var(--line); font-size:16px;}
::-webkit-scrollbar{display:none;}
.view{display:none; padding:12px 16px 20px; animation:fadein .25s ease; overflow-x:hidden;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:18px; margin-bottom:14px;}
.timerWrap{display:flex; flex-direction:row; align-items:center; gap:14px; padding:14px; background:var(--surface);}
.ring{position:relative; width:96px; height:96px; max-width:96px; flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring circle{fill:none; stroke-width:9;}
.ring .bg{stroke:var(--surface2);}
.ring .fg{stroke:#3b82f6; stroke-linecap:round; transition:stroke-dashoffset 1s linear;}
.ring .label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring .label .t{font-family:'Zen Maru Gothic',sans-serif; font-size:17px; font-weight:900;}
.ring .label .s{font-size:8px; color:var(--muted); margin-top:1px;}
.timerRight{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;}
.timerBtns{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px;}
#btnTimerReset[style*=\"display: none\"]{display:none!important;}
.pill{min-height:42px; padding:9px 13px; border-radius:999px; font-weight:700; font-size:14px; transition:transform .15s; white-space:nowrap; flex-shrink:0;}
.pill:active{transform:scale(.94);}
.pill.primary{background:#3a6ea5; color:#fff;}
.pill.ghost{background:var(--surface2); color:var(--ink);}
.pill.sm{padding:9px 13px; font-size:12.5px;}
.timerDone{color:#22c55e; font-weight:700; font-size:11px; min-height:14px;}
.recordBtn{width:100%; min-height:48px; padding:13px 16px; border-radius:12px; background:#3a6ea5; color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:var(--shadow);}
.recordBtn:active{transform:scale(.98);}
.todoRow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.todoRow:last-child{border-bottom:none;}
.chk{width:28px; height:28px; border-radius:8px; border:2px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; transition:.15s; font-size:14px;}
.chk.on{background:#22c55e; border-color:#22c55e; color:#fff;}
.todoRow .tx{flex:1; font-size:14px; overflow-wrap:anywhere;}
.todoRow.done .tx{text-decoration:line-through; color:var(--muted);}
.todoAdd{display:flex; gap:8px; margin-top:10px; align-items:center;}
.todoAdd input{flex:1; min-width:0; border-radius:var(--rs); padding:10px 12px;}
.roundBtn{width:42px; height:42px; border-radius:50%; background:#3a6ea5; color:#fff; font-size:20px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.roundBtn:active{transform:scale(.9); }
.iconDel{width:36px; height:36px; border-radius:9px; background:var(--surface2); color:#e2574c; font-size:15px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.iconDel:active{transform:scale(.9);}
.subjTabs{display:flex; gap:6px; flex-wrap:wrap;}
#rSubjTabs .stab:first-child{white-space:nowrap;}
.stab{padding:9px 14px; border-radius:10px; font-size:13px; font-weight:700; opacity:.5; transition:.15s;}
.stab.active{opacity:1; box-shadow:0 0 0 2px rgba(255,255,255,.72), 0 3px 8px rgba(0,0,0,.35); transform:translateY(-1px);}
.nav{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px; background:var(--surface); display:flex; border-top:1px solid var(--line); padding:8px 4px calc(8px + env(safe-area-inset-bottom)); z-index:40;}
.navBtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--muted); padding:4px 0; transition:.15s; position:relative;}
.navBtn .ic{font-size:20px; position:relative;}
.navBtn.active{color:var(--ink); transform:translateY(-2px);}
.navBadge{position:absolute; top:-2px; right:-7px; width:9px; height:9px; border-radius:50%; background:#e2574c; border:2px solid var(--surface);}
.modalBg{position:fixed; inset:0; background:rgba(3,6,18,.72); backdrop-filter:blur(5px); display:none; align-items:flex-end; justify-content:center; z-index:50;}
.modalBg.show{display:flex;}
.modal{background:var(--surface); border:1px solid var(--line); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; overflow-x:hidden; animation:slideup .28s cubic-bezier(.2,.9,.3,1); position:relative;}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal h3{font-size:17px; margin-bottom:12px;}
.compactRecordFields{margin-bottom:8px;}
.timeModeSwitch{display:flex; gap:6px; margin:-2px 0 10px;}
.timeModeBtn{flex:1; min-height:42px; border:1px solid var(--line); border-radius:9px; background:var(--surface2); color:var(--muted); font-weight:700;}
.timeModeBtn.active{background:#3a6ea5; border-color:#3a6ea5; color:#fff; box-shadow:inset 0 -2px 0 rgba(255,255,255,.35);}
.compactDuration{margin-bottom:8px;}
.compactSubject{margin-bottom:10px;}
#rSubjTabs{flex-wrap:nowrap; overflow-x:auto; padding:2px 0 5px; scrollbar-width:none;}
#rSubjTabs::-webkit-scrollbar{display:none;}
#rSubjTabs .stab{white-space:nowrap; flex:0 0 auto; padding:8px 11px; font-size:12px;}
.field{margin-bottom:14px;}
.field label{font-size:12px; color:var(--muted); display:block; margin-bottom:6px;}
.field input,.field select{width:100%; border-radius:var(--rs); padding:10px 12px;}
.field.row2{display:flex; gap:10px; flex-wrap:wrap;}
.field.row2 > div{flex:1 1 130px; min-width:130px;}
.field.row2 input[type="date"],.field.row2 input[type="time"]{font-size:14px; padding:10px 8px;}
.field.stackDT{display:flex; flex-direction:column; gap:12px;}
.field.stackDT > div{width:100%;}
.field.stackDT input{font-size:16px;}
.saveBtn{width:100%; min-height:46px; padding:12px; border-radius:10px; background:#3f7f5a; color:#fff; font-weight:700; font-size:15px; margin-top:6px;}
.saveBtn:active{transform:scale(.98);}
.closeX{position:absolute; right:18px; top:16px; font-size:20px; color:var(--muted);}
.wheelWrap{position:relative; display:flex; justify-content:center; align-items:center; gap:6px; height:112px; margin:3px 0 0;}
.compactDuration .wheelHighlight{top:36px;height:40px;}
.compactDuration .wheelCol{height:112px;}
.compactDuration .wheelItem{height:40px;}
.wheelHighlight{position:absolute; left:0; right:0; top:55px; height:40px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:rgba(59,130,246,.08); pointer-events:none;}
.wheelCol{width:64px; height:150px; overflow-y:scroll; scroll-snap-type:y mandatory; position:relative; -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain;}
.wheelItem{height:40px; display:flex; align-items:center; justify-content:center; font-size:19px; scroll-snap-align:center; color:var(--muted); font-weight:700;}
.wheelUnit{font-size:14px; color:var(--muted); align-self:center;}
.paintPalette{display:flex; flex:1; min-width:0; gap:7px; margin-bottom:0; flex-wrap:nowrap; overflow-x:auto; padding:2px 1px 4px; scrollbar-width:none;}
#paintPalette::-webkit-scrollbar{display:none;}
#eraserModeBtn{width:44px; height:40px; min-width:44px; padding:0; font-size:21px; line-height:1; border-radius:9px;}
#eraserModeBtn.active{background:#713c3c; color:#fff;}
.swatch{width:30px; height:30px; min-width:30px; border-radius:50%; border:2px solid transparent;}
.swatch.sel{border-color:var(--ink);}
.vbarsWrap{display:flex; gap:5px; align-items:flex-start;}
.hourLabels{display:flex; flex-direction:column; width:28px; flex-shrink:0;}
.hourLabels .h{height:48px; font-size:9px; color:var(--muted); display:flex; align-items:flex-start; padding-top:1px; cursor:pointer; transition:height .22s ease, color .15s; font-weight:700; border-radius:4px; overflow:hidden;}
.hourLabels .h:active{transform:scale(.92);}
.hourLabels .h.expanded{color:#3b82f6; text-decoration:underline;}
.vbarCol{display:flex; flex-direction:column; border-radius:8px; overflow:hidden; background:var(--surface2); user-select:none; touch-action:none;}
.vbarCol .seg{height:8px; border-bottom:1px solid var(--bg); position:relative; cursor:pointer; transition:height .22s ease;}
.noteDot{position:absolute; right:2px; top:2px; width:7px; height:7px; border-radius:50%; background:#fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.6);}
.segLabel{position:absolute; left:4px; top:50%; transform:translateY(-50%); font-size:9px; font-weight:900; opacity:.85; pointer-events:none;}
.segNote{position:absolute; inset:0; display:flex; align-items:center; padding:0 5px; font-size:10px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none;}
.calHead{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.calDowRow{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}
.calDowRow div{text-align:center; font-size:10px; color:var(--muted); font-weight:700;}
.calGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.calCell{aspect-ratio:1; border-radius:6px; background:var(--surface2); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; position:relative;}
.calCell.other{opacity:.25;}
.calCell.today{outline:2px solid #3b82f6;}
.calCell.sel{background:#315d87; color:#fff;}
.calCell .mins{font-size:8px; color:var(--muted); margin-top:1px; line-height:1;}
.calCell.sel .mins{color:rgba(255,255,255,.85);}
.statRow{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.statName{width:56px; font-size:12px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.statBarBg{flex:1; height:14px; background:var(--surface2); border-radius:7px; overflow:hidden;}
.statBarFg{height:100%; border-radius:7px; transition:width .5s ease;}
.statMin{width:52px; text-align:right; font-size:11px; color:var(--muted);}
.goalBarBg{height:16px; background:var(--surface2); border-radius:8px; overflow:hidden; margin-top:8px;}
.goalBarFg{height:100%; background:#4b7d9d; transition:width .5s ease;}
.toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#14161b; padding:10px 10px 10px 18px; border-radius:20px; font-size:13px; font-weight:700; opacity:0; transition:.3s; z-index:80; pointer-events:none; display:flex; flex-wrap:wrap; align-items:center; gap:8px; max-width:92%;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
.toast #toastUndo{background:#3a6ea5; color:#fff; padding:5px 12px; border-radius:999px; font-size:12px; font-weight:700; flex-shrink:0;}
.toast #toastExtra{background:#8b5cf6; color:#fff; padding:5px 12px; border-radius:999px; font-size:12px; font-weight:700; flex-shrink:0;}
.goalBarBg.goalDone{animation:goalPulse 1s ease 2;}
@keyframes goalPulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.55);} 50%{box-shadow:0 0 0 9px rgba(34,197,94,0);}}
textarea{width:100%; font-family:monospace; font-size:11px; border-radius:var(--rs); padding:10px; background:var(--surface2); color:var(--ink); border:1px solid var(--line); resize:none;}
.matCard{border-left:4px solid var(--all); border:1px solid var(--line); padding:12px 14px; border-radius:10px; background:var(--surface2); margin-bottom:10px; position:relative;}
.matProg{height:8px; background:var(--surface); border-radius:4px; overflow:hidden; margin-top:8px;}
.matProgFg{height:100%;}
.small{font-size:12px; color:var(--muted);}
@media(max-width:380px){.ring{width:84px;height:84px}.ring svg{width:84px;height:84px}.timerWrap{gap:10px;padding:12px}.timerRight{gap:4px}.pill.sm{font-size:12px;padding:8px 7px;min-height:42px}}
.rowBetween{display:flex; justify-content:space-between; align-items:center; gap:8px;}
.addToggle{display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:14px; border-radius:14px; background:var(--surface2); font-weight:700; font-size:14px; margin-bottom:10px;}
.addToggle:active{transform:scale(.98);}
.addPanel{display:none;}
.addPanel.open{display:block; animation:fadein .2s ease;}
.subjRow{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line);}
.subjRow:last-child{border-bottom:none;}
.subjDot{width:14px; height:14px; border-radius:50%; flex-shrink:0;}
.sessRow{cursor:pointer; border-radius:8px; padding:2px 4px; margin:0 -4px;}
.sessRow:active{background:var(--surface);}
</style>
</head>
<body>
<div class="app" id="app">
 
  <div class="view active" id="view-home">
    <div class="card timerWrap">
      <div class="ring">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle class="bg" cx="48" cy="48" r="40"></circle>
          <circle class="fg" id="ringFg" cx="48" cy="48" r="40"></circle>
        </svg>
        <div class="label"><div class="t" id="timerText">25:00</div><div class="s">集中タイム</div></div>
      </div>
      <div class="timerRight">
        <div class="timerBtns">
          <button class="pill primary sm" id="btnTimerToggle">スタート</button>
          <button class="pill sm" id="btnOpenRecord" style="background:#3a6ea5; color:#fff;">✏️ 記録</button>
          <button class="pill sm" id="btnTimerBreak" style="display:none; background:#8b5cf6; color:#fff;">☕休憩</button>
          <button class="pill ghost sm" id="btnTimerReset">リセット</button>
        </div>
        <div class="timerDone" id="timerDoneMsg"></div>
      </div>
    </div>
 
    <div class="card">
      <h3>今日のやること</h3>
      <div id="todoList"></div>
      <div class="todoAdd"><input id="todoInput" placeholder="やることを追加"><button class="roundBtn" id="btnTodoAdd" aria-label="やることを追加">＋</button></div>
    </div>
  </div>
 
  <div class="view" id="view-cal">
    <div class="card">
      <div class="calHead">
        <button class="pill ghost" id="calPrev">←</button>
        <h3 id="calTitle">-</h3>
        <button class="pill ghost" id="calNext">→</button>
      </div>
      <div class="small" id="calWeekTotal" style="text-align:center; margin:-4px 0 8px; display:none;">-</div>
      <div class="calDowRow" id="calDowRow"></div>
      <div class="calGrid" id="calGrid"></div>
      <button class="pill ghost" id="calModeToggle" style="width:100%; margin-top:10px;">1ヶ月表示</button>
    </div>
 
    <div class="card">
      <div class="rowBetween">
        <h3 style="font-size:14px;">1日の予定と記録</h3>
        <span class="small" id="dayBarsDate">-</span>
      </div>
      <div class="rowBetween" style="margin-bottom:8px;">
        <div class="paintPalette" id="paintPalette" style="margin-bottom:0;"></div>
        <button class="pill ghost" id="eraserModeBtn" aria-label="消しゴム">🧹</button>
      </div>
      <div class="vbarsWrap">
        <div class="hourLabels" id="hourLabels"></div>
        <div style="flex:1;">
          <div class="small" style="text-align:center; margin-bottom:4px;">予定</div>
          <div class="vbarCol" id="planBar"></div>
        </div>
        <div style="flex:1;">
          <div class="small" style="text-align:center; margin-bottom:4px;">実際</div>
          <div class="vbarCol" id="actualBar"></div>
        </div>
      </div>
      <button class="pill ghost" id="btnDayShare" style="width:100%; margin-top:10px;">📤 この予定を他の日にコピー</button>
    </div>
  </div>
 
  <div class="view" id="view-mat">
    <button class="addToggle" id="matAddToggle">＋ 教材を追加</button>
    <div class="card addPanel" id="matAddPanel">
      <div class="field"><label>教科</label><select id="matSubject"></select></div>
      <div class="field"><label>教材名</label><input id="matName" placeholder="例：ターゲット1900"></div>
      <div class="field row2">
        <div><label>開始ページ（任意）</label>
          <div class="wheelWrap" style="justify-content:flex-start;">
            <div class="wheelHighlight"></div>
            <div class="wheelCol" id="wheelMatStart"></div>
          </div>
        </div>
        <div><label>終了ページ（任意）</label>
          <div class="wheelWrap" style="justify-content:flex-start;">
            <div class="wheelHighlight"></div>
            <div class="wheelCol" id="wheelMatEnd"></div>
          </div>
        </div>
      </div>
      <div class="field row2">
        <div><label>開始日（任意）</label><input id="matStart" type="date"></div>
        <div><label>終了日（任意）</label><input id="matEnd" type="date"></div>
      </div>
      <div class="field">
        <label>計画モード</label>
        <div class="subjTabs" id="matModeTabs">
          <div class="stab active" data-mode="forgetting" style="background:#3a6ea5; color:#fff;">🔁 忘却曲線で復習</div>
          <div class="stab" data-mode="pace" style="background:#3f7f5a; color:#fff;">➡️ 期限までに1周</div>
        </div>
      </div>
      <button class="saveBtn" id="btnAddMat">追加する</button>
    </div>
    <div id="matList"></div>
  </div>
 
  <div class="view" id="view-set">
    <div class="card">
      <h3>教科を追加</h3>
      <div class="todoAdd"><input id="subjInput" placeholder="教科名（例：情報）"><button class="roundBtn" id="btnSubjAdd" aria-label="教科を追加">＋</button></div>
      <div id="subjList" style="margin-top:10px;"></div>
    </div>
    <div class="card">
      <h3>バックアップ</h3>
      <textarea id="backupOut" rows="4" readonly></textarea>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="pill ghost" id="btnCopyBackup" style="flex:1;">コードをコピー</button>
        <button class="pill ghost" id="btnDownloadBackup" style="flex:1;">ファイルに保存</button>
      </div>
    </div>
    <div class="card">
      <h3>復元する</h3>
      <textarea id="restoreIn" rows="4" placeholder="保存しておいたコードを貼り付け"></textarea>
      <button class="pill ghost" id="btnRestore" style="margin-top:8px;">復元する</button>
    </div>
    <div class="card">
      <h3>データを消去</h3>
      <button class="pill ghost" id="btnReset" style="color:#e2574c;">すべて削除する</button>
    </div>
  </div>
 
  <div class="nav">
    <button class="navBtn active" data-view="home"><div class="ic">🏠</div>ホーム</button>
    <button class="navBtn" data-view="cal"><div class="ic">📅</div>カレンダー</button>
    <button class="navBtn" data-view="mat"><div class="ic">📚<span class="navBadge" id="matBadge" style="display:none;"></span></div>教材</button>
    <button class="navBtn" data-view="set"><div class="ic">⚙️</div>設定</button>
  </div>
</div>
 
<div class="modalBg" id="recordModalBg">
  <div class="modal">
    <div class="closeX" data-close="recordModalBg" role="button" aria-label="閉じる">✕</div>
    <h3 id="recordModalTitle">学習を記録</h3>
    <input id="rTimeMode" type="hidden" value="start">
    <div class="field row2 compactRecordFields">
      <div><label>日付</label><input id="rDate" type="date"></div>
      <div><label id="rTimeLabel">開始時刻</label><input id="rStart" type="time"></div>
    </div>
    <div class="timeModeSwitch" role="group" aria-label="時刻の種類">
      <button type="button" class="timeModeBtn active" id="rModeStart">開始から</button>
      <button type="button" class="timeModeBtn" id="rModeEnd">終了から</button>
    </div>
    <div class="field compactDuration"><label>学習時間</label>
      <div class="wheelWrap">
        <div class="wheelHighlight"></div>
        <div class="wheelCol" id="wheelHour"></div>
        <div class="wheelUnit">時間</div>
        <div class="wheelCol" id="wheelMin"></div>
        <div class="wheelUnit">分</div>
      </div>
    </div>

const dowJp=["日","月","火","水","木","金","土"];

const timeToMin = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };

/* ===================== データ層（二重バックアップ） ===================== */
const DB_KEY="sl2_data", DB_BACKUP_KEY="sl2_data_backup";
function migrateSparse(obj){
  const out={};
  Object.keys(obj||{}).forEach(key=>{
    const val=obj[key], sparse={};
    if(Array.isArray(val)){ val.forEach((v,i)=>{ if(v) sparse[i]=v; }); }
    else if(val && typeof val==='object'){ Object.keys(val).forEach(k=>{ if(val[k]) sparse[k]=val[k]; }); }
    if(Object.keys(sparse).length) out[key]=sparse;
  });
  return out;
}
// 予定データを {index:subjectId} のスパース形式から、ひとかたまりの範囲(ブロック){s,e,subj,note} 形式へ移行
function migratePlanBlocks(data){
  const raw = data.dayPlans && typeof data.dayPlans==='object' ? data.dayPlans : {};
  const notes = data.dayNotes && typeof data.dayNotes==='object' ? data.dayNotes : {};
  const out={};
  Object.keys(raw).forEach(key=>{
    const value=raw[key];
    if(Array.isArray(value) && value.every(b=>b && typeof b==='object' && Number.isFinite(Number(b.s)) && Number.isFinite(Number(b.e)))){
      out[key]=value.map(b=>({...b,s:Math.max(0,Math.min(DAY_SLOTS-1,Math.round(Number(b.s)))),e:Math.max(0,Math.min(DAY_SLOTS-1,Math.round(Number(b.e)))),note:String(b.note||'')})).filter(b=>b.s<=b.e);
      return;
    }
    const sparse=migrateSparse({[key]:value})[key]||{};
    const idxs=Object.keys(sparse).map(Number).filter(Number.isFinite).sort((a,b)=>a-b);
    const blocks=[]; let cur=null;
    idxs.forEach(i=>{
      const slot=Math.max(0,Math.min(DAY_SLOTS-1,Math.round(i))), subj=sparse[i];
      if(cur && cur.e===slot-1 && cur.subj===subj) cur.e=slot;
      else { cur={s:slot,e:slot,subj,note:''}; blocks.push(cur); }
    });
    const dn=notes[key]||{};
    blocks.forEach(b=>{ let t=''; for(let i=b.s;i<=b.e;i++){ const n=dn['plan_'+i]; if(n) t=t?t+' / '+n:String(n); } b.note=t; });
    if(blocks.length) out[key]=blocks;
  });
  data.dayPlans=out;
  Object.keys(notes).forEach(key=>{
    if(!notes[key] || typeof notes[key]!=='object') return;
    Object.keys(notes[key]).forEach(k=>{ if(k.startsWith('plan_')) delete notes[key][k]; });
    if(!Object.keys(notes[key]).length) delete notes[key];
  });
}
function normalizeDB(data){
  data = data && typeof data==='object' ? data : {};
  data.sessions = Array.isArray(data.sessions) ? data.sessions : [];
  data.sessions = data.sessions.filter(s=>s && typeof s==='object' && /^\d{4}-\d{2}-\d{2}$/.test(s.date||'') && /^\d{2}:\d{2}$/.test(s.startTime||''))
    .map(s=>({...s, id:s.id ?? Date.now()+Math.random(), minutes:Math.max(1,Math.round(Number(s.minutes)||0)), subjectId:s.subjectId||'all'}));
  data.todos = data.todos && typeof data.todos==='object' && !Array.isArray(data.todos) ? data.todos : {};
  data.materials = Array.isArray(data.materials) ? data.materials.filter(m=>m && typeof m==='object').map(m=>({...m,
    id:m.id ?? Date.now()+Math.random(), startPage:m.startPage==null?null:Math.max(1,Math.round(Number(m.startPage)||1)), endPage:m.endPage==null?null:Math.max(1,Math.round(Number(m.endPage)||1)),
    doneUpTo:m.doneUpTo==null?null:Math.max(0,Math.round(Number(m.doneUpTo)||0))
  })) : [];
  data.dayPlans = data.dayPlans && typeof data.dayPlans==='object' ? data.dayPlans : {};
  data.dayNotes = migrateSparse(data.dayNotes);
  migratePlanBlocks(data);
  data.customSubjects = Array.isArray(data.customSubjects) ? data.customSubjects.filter(s=>s && s.id && s.name).map(s=>({...s,name:String(s.name),color:s.color||CUSTOM_PALETTE[0]})) : [];
  data.weeklyGoalMin = Math.max(0,Math.round(Number(data.weeklyGoalMin) || 300));
  data.lastCarryDate = data.lastCarryDate || null;
  data.lastGoalCelebration = data.lastGoalCelebration || null;
  return data;
}
function loadDB(){
  let raw = localStorage.getItem(DB_KEY) || localStorage.getItem(DB_BACKUP_KEY);
  let data; try{ data = raw?JSON.parse(raw):null; }catch{ data=null; }
  return normalizeDB(data);
}
let DB = loadDB();
let _sessionsByDateCache = null;
function sessionsByDate(){
  if(_sessionsByDateCache) return _sessionsByDateCache;
  const map={};
  DB.sessions.forEach(s=>{ (map[s.date] = map[s.date]||[]).push(s); });
  return (_sessionsByDateCache = map);
}
function invalidateSessionsCache(){ _sessionsByDateCache = null; }
function saveDB(){
  const raw = JSON.stringify(DB);
  let ok=false;
  try{ localStorage.setItem(DB_KEY, raw); ok=true; }catch{}
  try{ localStorage.setItem(DB_BACKUP_KEY, raw); ok=true; }catch{}
  if(!ok){ toast('⚠️ 保存に失敗しました。ストレージ容量を確認してください'); }
}

/* ===================== タイマー ===================== */
const FOCUS_TOTAL=25*60, BREAK_TOTAL=5*60;
const TIMER_KEY='sl2_timer';
let timerMode='focus';
let timerTotal=FOCUS_TOTAL;
let timerRunning=false, timerHandle=null;
let timerRunStartAt=null;
let timerAccumSec=0;
let timerStartClock=null;
let focusNotified=false;
const ringFg=document.getElementById('ringFg'), CIRC=2*Math.PI*40;
ringFg.setAttribute('stroke-dasharray', CIRC);
 
function elapsedSec(){
  return timerAccumSec + (timerRunning ? Math.floor((Date.now()-timerRunStartAt)/1000) : 0);
}
function currentElapsedSec(){ return timerMode==='focus' ? elapsedSec() : 0; }
function vibrateDevice(pattern){ if(navigator.vibrate) navigator.vibrate(pattern||[200,100,200]); }
let audioCtx=null, lastSoundAt=0;
function ensureAudioCtx(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  else if(audioCtx.state==='suspended'){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}
function playSuccessSound(){
  const now=performance.now(); if(now-lastSoundAt<70) return; lastSoundAt=now;
  const ctx=ensureAudioCtx(); if(!ctx) return;
  try{ [523.25,659.25,783.99].forEach((freq,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination); const t=ctx.currentTime+i*.12; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.025); g.gain.exponentialRampToValueAtTime(.0001,t+.28); o.start(t); o.stop(t+.3); }); }catch(e){}
}
function playActionSound(kind='tap'){
  const now=performance.now(); if(now-lastSoundAt<70) return; lastSoundAt=now;
  const ctx=ensureAudioCtx(); if(!ctx) return;
  const patterns={
    start:[[392,.10,0],[523,.13,.08]],
    pause:[[523,.10,0],[392,.10,.08]],
    reset:[[330,.10,0],[262,.13,.08]],
    check:[[660,.08,0],[880,.10,.07]],
    tap:[[540,.045,0]],
    success:[[523,.08,0],[659,.08,.08],[784,.14,.16]],
    delete:[[220,.08,0],[165,.12,.08]]
  };
  try{ (patterns[kind]||patterns.tap).forEach(([freq,dur,delay])=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination); const t=ctx.currentTime+delay; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.10,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur+.02); }); }catch(e){}
}
function playBeep(){
  const ctx = audioCtx;
  if(!ctx) return;
  try{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.6);
    o.stop(ctx.currentTime+0.6);
  }catch(e){}
}
function saveTimerState(){
  const state = {
    mode: timerMode, running: timerRunning,
    runStartAt: timerRunning ? timerRunStartAt : null,
    accumSec: timerAccumSec, totalSec: timerTotal,
    startClock: timerStartClock ? timerStartClock.getTime() : null,
    focusNotified
  };
  try{ localStorage.setItem(TIMER_KEY, JSON.stringify(state)); }catch{}
}
function loadTimerState(){
  let st=null;
  try{ const raw=localStorage.getItem(TIMER_KEY); if(raw) st=JSON.parse(raw); }catch{}
  if(!st) return;
  timerMode = st.mode==='break' ? 'break' : 'focus';
  timerTotal = st.totalSec || (timerMode==='focus'?FOCUS_TOTAL:BREAK_TOTAL);
  timerStartClock = st.startClock ? new Date(st.startClock) : null;
  timerAccumSec = st.accumSec || 0;
  focusNotified = !!st.focusNotified;
  if(st.running && st.runStartAt){
    timerAccumSec += Math.max(0, Math.floor((Date.now()-st.runStartAt)/1000));
    timerRunning=true; timerRunStartAt=Date.now();
    clearInterval(timerHandle);
    timerHandle=setInterval(tickTimer,1000);
    if(timerMode==='focus' && !focusNotified && timerAccumSec>=timerTotal){
      focusNotified=true;
      document.getElementById('timerDoneMsg').textContent="タイマーが完了していました。キリのよいところで記録しましょう";
    } else if(timerMode==='break' && timerAccumSec>=timerTotal){
      clearInterval(timerHandle); timerRunning=false;
      timerMode='focus'; timerTotal=FOCUS_TOTAL; timerAccumSec=0; timerStartClock=null; focusNotified=false;
      document.getElementById('timerDoneMsg').textContent="休憩は終わっています。つぎの集中タイムを始めましょう";
    }
  } else {
    timerRunning=false; timerRunStartAt=null;
  }
  saveTimerState();
}
function renderTimer(){
  const rem = timerTotal - elapsedSec();
  const over = rem<0;
  const showSec = Math.abs(rem);
  const m=Math.floor(showSec/60), s=showSec%60;
  document.getElementById('timerText').textContent = (over?'+':'') + `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  document.querySelector('.ring .label .s').textContent = timerMode==='focus' ? (over?'延長中':'集中タイム') : '休憩タイム';
  const prog = Math.min(1, elapsedSec()/timerTotal);
  ringFg.style.strokeDashoffset = CIRC*(1-prog);
  ringFg.style.stroke = timerRunning ? (over ? '#f97316' : (timerMode==='focus' ? "#3b82f6" : "#8b5cf6")) : "#565c68";
  document.getElementById('btnTimerToggle').textContent = timerRunning ? '一時停止' : (elapsedSec()>0 ? '再開' : 'スタート');
  const es = elapsedSec();
  document.getElementById('btnTimerBreak').style.display = (timerMode==='focus' && !timerRunning && es>=timerTotal) ? 'inline-block' : 'none';
  document.getElementById('btnTimerReset').style.display = es>0 ? 'inline-block' : 'none';
}
function startTimer(){
  if(timerRunning) return;
  ensureAudioCtx(); playActionSound('start');
  timerRunning=true;
  timerRunStartAt=Date.now();
  if(timerMode==='focus' && !timerStartClock) timerStartClock = new Date();
  clearInterval(timerHandle);
  timerHandle=setInterval(tickTimer, 1000);
  document.getElementById('timerDoneMsg').textContent="";
  saveTimerState();
  renderTimer();
}
function pauseTimer(){
  if(!timerRunning) return;
  ensureAudioCtx(); playActionSound('pause');
  timerAccumSec += Math.floor((Date.now()-timerRunStartAt)/1000);
  timerRunning=false; timerRunStartAt=null;
  clearInterval(timerHandle);
  saveTimerState();
  renderTimer();
}
function resetTimer(){
  ensureAudioCtx(); playActionSound('reset');
  clearInterval(timerHandle); timerRunning=false;
  timerMode='focus'; timerTotal=FOCUS_TOTAL; timerAccumSec=0; timerRunStartAt=null; timerStartClock=null; focusNotified=false;
  document.getElementById('timerDoneMsg').textContent="";
  saveTimerState();
  renderTimer();
}
function tickTimer(){
  renderTimer();
  const es = elapsedSec();
  if(timerMode==='focus' && !focusNotified && es>=timerTotal){
    focusNotified=true;
    vibrateDevice(); ensureAudioCtx(); playBeep(); playActionSound('success');
    document.getElementById('timerDoneMsg').textContent="25分たちました。キリのよいところで記録しましょう";
    saveTimerState();
  } else if(timerMode==='break' && es>=timerTotal){
    clearInterval(timerHandle); timerRunning=false;
    vibrateDevice(); ensureAudioCtx(); playBeep(); playActionSound('success');
    timerMode='focus'; timerTotal=FOCUS_TOTAL; timerAccumSec=0; timerRunStartAt=null; timerStartClock=null; focusNotified=false;
    document.getElementById('timerDoneMsg').textContent="休憩終了！つぎの集中タイムを始めましょう";
    saveTimerState();
    renderTimer();
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && timerRunning) tickTimer();
  else if(document.visibilityState==='hidden' && timerRunning) saveTimerState();
});
window.addEventListener('pagehide', ()=>{ if(timerRunning) saveTimerState(); });
document.getElementById('btnTimerToggle').onclick=()=>{ ensureAudioCtx(); timerRunning ? pauseTimer() : startTimer(); };
document.getElementById('btnTimerReset').onclick=()=>resetTimer();
document.getElementById('btnTimerBreak').onclick=()=>{
  ensureAudioCtx();
  timerMode='break'; timerTotal=BREAK_TOTAL; timerAccumSec=0; timerRunStartAt=null; timerStartClock=null; focusNotified=false;
  document.getElementById('timerDoneMsg').textContent="";
  startTimer();
};
loadTimerState();
renderTimer();
 
/* ===================== Todo ===================== */
function todosOfToday(){ const k=todayKey(); if(!DB.todos[k]) DB.todos[k]=[]; return DB.todos[k]; }
function carryOverTodos(){
  const tk = todayKey();
  if(DB.lastCarryDate === tk) return;
  const todayList = DB.todos[tk] || (DB.todos[tk]=[]);
  Object.keys(DB.todos).forEach(dateKey=>{
    if(dateKey===tk || dateKey>tk) return;
    const list = DB.todos[dateKey] || [];
    const remaining = list.filter(t=>!t.done);
    if(remaining.length) todayList.push(...remaining.map(t=>({text:t.text, done:false})));
    const doneOnly = list.filter(t=>t.done);
    if(doneOnly.length) DB.todos[dateKey]=doneOnly; else delete DB.todos[dateKey];
  });
  DB.lastCarryDate = tk;
  saveDB();
}
function renderTodos(){
  const list=todosOfToday();
  const el=document.getElementById('todoList');
  el.innerHTML = list.length? list.map((t,i)=>`
    <div class="todoRow ${t.done?'done':''}">
      <div class="chk ${t.done?'on':''}" data-i="${i}" role="checkbox" aria-checked="${t.done?'true':'false'}" aria-label="完了にする">${t.done?'✓':''}</div>

/* ===================== 時間ホイールピッカー ===================== */
const WHEEL_ITEM_H=40, WHEEL_PAD=55;
function wheelBaseOffset(container){ return Math.max(0, WHEEL_PAD-(container.clientHeight-WHEEL_ITEM_H)/2); }
function snapWheel(container, sound=true){
  const base=wheelBaseOffset(container), idx=Math.max(0,Math.min((container._items||[]).length-1,Math.round((container.scrollTop-base)/WHEEL_ITEM_H)));
  const top=base+idx*WHEEL_ITEM_H;
  if(Math.abs(container.scrollTop-top)>0.5) container.scrollTo({top,behavior:'smooth'});
  if(sound){ ensureAudioCtx(); playActionSound('tap'); }
  return idx;
}
function buildWheel(container, items, initialValue){
  container.innerHTML = `<div style="height:${WHEEL_PAD}px"></div>` +
    items.map(v=>`<div class="wheelItem" data-v="${v}">${String(v).padStart(2,'0')}</div>`).join('') +
    `<div style="height:${WHEEL_PAD}px"></div>`;
  container._items=items;
  const idx = Math.max(0, items.indexOf(initialValue));
  requestAnimationFrame(()=>{ container.scrollTop=wheelBaseOffset(container)+idx*WHEEL_ITEM_H; });
  container.onscroll=()=>{ clearTimeout(container._snapTimer); container._snapTimer=setTimeout(()=>snapWheel(container,false),120); };
  container.querySelectorAll('.wheelItem').forEach((el,i)=>el.onclick=()=>{ snapWheel(container,true); container.scrollTo({top:wheelBaseOffset(container)+i*WHEEL_ITEM_H, behavior:'smooth'}); });
}
function getWheelValue(container, items){ const idx=snapWheel(container,false); return items[Math.max(0,Math.min(items.length-1,idx))]; }
const HOUR_ITEMS=[...Array(10).keys()];
const MIN_ITEMS=[...Array(60).keys()];
 
// 任意の数値範囲用ホイール（ページ番号などをタップ入力の代わりにスクロールで選ぶ）
function buildNumWheel(container, min, max, initial, allowNone){
  const nums=[]; for(let n=min;n<=max;n++) nums.push(n);
  const items = allowNone ? [null,...nums] : nums;
  container.innerHTML = `<div style="height:${WHEEL_PAD}px"></div>` +
    items.map(v=>`<div class="wheelItem" data-v="${v===null?'':v}">${v===null?'―':v}</div>`).join('') +
    `<div style="height:${WHEEL_PAD}px"></div>`;
  container._items=items;
  const idx = (initial==null) ? 0 : Math.max(0, items.indexOf(Number(initial)));
  requestAnimationFrame(()=>{ container.scrollTop=wheelBaseOffset(container)+idx*WHEEL_ITEM_H; });
  container.onscroll=()=>{ clearTimeout(container._snapTimer); container._snapTimer=setTimeout(()=>snapWheel(container,false),120); };
  container.querySelectorAll('.wheelItem').forEach((el,i)=>el.onclick=()=>{ snapWheel(container,true); container.scrollTo({top:wheelBaseOffset(container)+i*WHEEL_ITEM_H, behavior:'smooth'}); });
}
function getNumWheel(container){ const items=container._items||[]; const idx=snapWheel(container,false); return items[Math.max(0,Math.min(items.length-1,idx))]; }

/* ===================== 予定バー（ブロック型データ） ===================== */
// DB.dayPlans[date] = [{s,e,subj,note}, ...]  ひとかたまりの範囲(10分刻みインデックス)ごとに1件
let paintSubject="all";
let expandedHours = new Set();
let eraserMode = false;

function planRefArray(key){
  const arr=Array(DAY_SLOTS).fill(null);
  (DB.dayPlans[key]||[]).forEach(b=>{ for(let i=b.s;i<=b.e;i++) arr[i]=b; });
  return arr;
}
function findPlanBlock(key,i){ return (DB.dayPlans[key]||[]).find(b=>i>=b.s && i<=b.e); }
function erasePlanRange(key,s,e){
  const out=[];
  (DB.dayPlans[key]||[]).forEach(b=>{
    if(b.e<s || b.s>e){ out.push(b); return; }
    if(b.s<s) out.push({s:b.s,e:s-1,subj:b.subj,note:b.note,gid:b.gid});
    if(b.e>e) out.push({s:e+1,e:b.e,subj:b.subj,note:b.note,gid:b.gid});
  });
  if(out.length) DB.dayPlans[key]=out; else delete DB.dayPlans[key];
}
// 共有(コピー)された予定のグループIDを持つブロックについて、同じ範囲を他の日からもまとめて削除する
function propagateDelete(gids, s, e, excludeKey){
  let n=0;
  Object.keys(DB.dayPlans).forEach(k=>{
    if(k===excludeKey) return;
    const hit = (DB.dayPlans[k]||[]).some(b=>b.gid && gids.includes(b.gid) && b.e>=s && b.s<=e);
    if(hit){ erasePlanRange(k,s,e); n++; }
  });
  saveDB();
  renderDayBars(selectedCalDate);
  toast(n>0 ? `他${n}日からも同じ予定を削除しました` : '他の日には見つかりませんでした');
}
function paintPlanRange(key,s,e,subj){
  erasePlanRange(key,s,e);
  (DB.dayPlans[key]=DB.dayPlans[key]||[]).push({s,e,subj,note:''});
}
// 予定ブロックを1件削除（元に戻す操作つき）。共有(コピー)済みの予定なら他の日からも消せるボタンを数秒表示する
function deletePlanBlockWithUndo(key, block){
  const snap={...block};
  const gid = block.gid;
  erasePlanRange(key, block.s, block.e);
  saveDB(); closeModal('noteModalBg'); renderDayBars(key);
  const extra = gid ? {label:'他の日も削除', fn: ()=>propagateDelete([gid], block.s, block.e, key)} : null;
  toast('予定を削除しました', ()=>{
    (DB.dayPlans[key]=DB.dayPlans[key]||[]).push(snap);
    saveDB(); renderDayBars(key);
  }, extra);
}
// なぞった範囲(s〜e)だけを削除（ブロックが分割されて残ってもよい）。元に戻す操作は範囲内にあった元のブロックをすべて正確に復元する
// 共有(コピー)済みの予定が1コマでも含まれていれば、他の日からも同じ範囲を消せるボタンを数秒表示する
function deleteRangeWithUndo(key, s, e){
  const before = (DB.dayPlans[key]||[]).filter(b => b.e>=s && b.s<=e).map(b=>({...b}));
  if(!before.length) return;
  const gids = [...new Set(before.map(b=>b.gid).filter(Boolean))];
  erasePlanRange(key, s, e);
  vibrateDevice(8); saveDB(); renderDayBars(key);
  const extra = gids.length ? {label:'他の日も削除', fn: ()=>propagateDelete(gids, s, e, key)} : null;
  toast('予定を削除しました', ()=>{
    before.forEach(b=>{
      erasePlanRange(key, b.s, b.e); // 分割済みの残骸を一旦クリアしてから
      (DB.dayPlans[key]=DB.dayPlans[key]||[]).push(b); // 元のブロックをそのまま復元
    });
    saveDB(); renderDayBars(key);
  }, extra);
}

function segHtml(v, note, i, h, type, expanded, showBorder, isStart){
  const bg = v ? subjOf(v).color : ((h%2===0)?'var(--hourA)':'var(--hourB)');
  // showBorder=時間の切れ目やブロック端は太い境界線。同一の記録(v)が複数マスにまたがる内部は
  // 10分刻みの区切り線を消して教科の色で塗りつぶし、記録がないマスだけ薄い境界線を表示する。
  let border;
  if(showBorder) border = 'border-bottom:2px solid var(--bg);';
  else if(v) border = 'border-bottom:none;';
  else border = 'border-bottom:1px solid rgba(255,255,255,.08);';
  // 展開時は必ずメモのみを表示する（教科名の代替表示はしない）
  let inner='';
  if(expanded && isStart && note) inner = `<span class="segNote" style="color:${textOnColor(bg)}">${escapeHtml(note)}</span>`;
  else if(!expanded && isStart && note) inner = '<span class="noteDot"></span>';
  return `<div class="seg" data-h="${h}" data-i="${i}" data-type="${type}" style="background:${bg}; height:${expanded?24:8}px;${border}">${inner}</div>`;
}
// 同じ予定/実績の「ひとかたまり」だけを1つの連続した色として描画する（別々に作った予定は色が同じでも境界線を残す）
function buildCol(refs, type, key, expandedSet, colorOf){
  let html='';
  for(let h=0; h<24; h++){
    const expanded = expandedSet.has(h);
    for(let i=h*6;i<h*6+6;i++){
      const ref = refs[i];
      const isStart = (i===0) || refs[i-1]!==ref;
      const isEnd = (i===DAY_SLOTS-1) || refs[i+1]!==ref;
      const v = ref ? colorOf(ref) : null;
      const note = isStart ? (type==='plan' ? (ref?ref.note||'':'') : (dayNotesOf(key)['actual_'+i]||'')) : '';
      html += segHtml(v, note, i, h, type, expanded, isEnd || i%6===5, isStart);
    }
  }
  return html;
}
function renderDayBars(key){
  const palette=document.getElementById('paintPalette');
  palette.innerHTML = getSubjects().map(s=>`<div class="swatch ${s.id===paintSubject?'sel':''}" style="background:${s.color}" data-id="${s.id}" role="button" aria-label="${s.name}"></div>`).join('');
  palette.querySelectorAll('.swatch').forEach(sw=>sw.onclick=()=>{ paintSubject=sw.dataset.id; palette.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel')); sw.classList.add('sel'); });
 
  const actual = Array(DAY_SLOTS).fill(null);
  (sessionsByDate()[key]||[]).forEach(s=>{
    const startSlot = Math.floor(timeToMin(s.startTime)/10);
    const count = Math.max(1, Math.ceil(s.minutes/10));
    for(let i=startSlot; i<Math.min(DAY_SLOTS,startSlot+count); i++) actual[i]=s;
  });
 
  document.getElementById('hourLabels').innerHTML = [...Array(24).keys()].map(h=>{
    const exp = expandedHours.has(h);
    return `<div class="h ${exp?'expanded':''}" data-h="${h}" style="height:${exp?144:48}px;">${h}時</div>`;
  }).join('');
  document.getElementById('hourLabels').querySelectorAll('.h').forEach(el=>{ el.onclick=()=>toggleHourExpand(+el.dataset.h, key); });
 
  document.getElementById('planBar').innerHTML = buildCol(planRefArray(key), 'plan', key, expandedHours, r=>r.subj);
  document.getElementById('actualBar').innerHTML = buildCol(actual, 'actual', key, expandedHours, r=>r.subjectId);
}
function toggleHourExpand(h, key){
  const willExpand = !expandedHours.has(h);
  document.querySelectorAll(`#planBar .seg[data-h="${h}"], #actualBar .seg[data-h="${h}"]`).forEach(el=>{ el.style.height = (willExpand?24:8)+'px'; });
  const labelEl = document.getElementById('hourLabels').querySelector(`.h[data-h="${h}"]`);
  if(labelEl){ labelEl.style.height = (willExpand?144:48)+'px'; labelEl.classList.toggle('expanded', willExpand); }
  willExpand ? expandedHours.add(h) : expandedHours.delete(h);
  clearTimeout(toggleHourExpand._t);
  toggleHourExpand._t = setTimeout(()=>renderDayBars(key), 230);
}
 
// なぞって予定を作成（指を離すまでが1つの予定）／消しゴムモードで範囲を消去／塗られたマスをタップでメモ編集／上方向になぞって範囲だけ削除
let dragActive=false, dragKey=null, dragS=0, dragCur=0, dragMoved=false, dragStartY=0, dragLastY=0;
function planSegAt(el){ return (el && el.dataset && el.dataset.type==='plan') ? el : null; }
function dragStart(el, y){
  el=planSegAt(el); if(!el) return;
  dragActive=true; dragKey=selectedCalDate; dragS=+el.dataset.i; dragCur=dragS; dragMoved=false;
  dragStartY=y; dragLastY=y;
}
function dragMove(el, y){
  if(!dragActive) return;
  dragLastY=y;
  el=planSegAt(el); if(!el) return;
  const i=+el.dataset.i;
  if(i!==dragCur){ dragCur=i; dragMoved=true; }
}
function dragEnd(){
  if(!dragActive) return; dragActive=false;
  const s=Math.min(dragS,dragCur), e=Math.max(dragS,dragCur);
  // 塗りつぶし済みのマスから上方向へなぞったら、触れた位置〜離した位置の範囲だけを削除する（上下に分かれてもよい）
  const swipedUp = (dragLastY-dragStartY) <= -8;
  if(!eraserMode && swipedUp && findPlanBlock(dragKey, dragS)){
    deleteRangeWithUndo(dragKey, s, e);
    return;
  }
  if(!dragMoved){
    if(eraserMode){ deleteRangeWithUndo(dragKey,s,e); }
    else if(findPlanBlock(dragKey,s)){ openNoteEditor('plan', dragKey, s); }
    else { paintPlanRange(dragKey,s,e,paintSubject); ensureAudioCtx(); playActionSound('tap'); vibrateDevice(8); saveDB(); renderDayBars(dragKey); }
    return;
  }
  if(eraserMode){ deleteRangeWithUndo(dragKey,s,e); }
  else { paintPlanRange(dragKey,s,e,paintSubject); ensureAudioCtx(); playActionSound('tap'); vibrateDevice(8); saveDB(); renderDayBars(dragKey); }
}
const planBarEl=document.getElementById('planBar'), actualBarEl=document.getElementById('actualBar');
planBarEl.addEventListener('pointerdown', e=>dragStart(document.elementFromPoint(e.clientX,e.clientY), e.clientY));
document.addEventListener('pointermove', e=>{ if(dragActive) dragMove(document.elementFromPoint(e.clientX,e.clientY), e.clientY); });
document.addEventListener('pointerup', dragEnd);
actualBarEl.addEventListener('click', e=>{
  const el=e.target;
  if(el && el.dataset && el.dataset.type==='actual') openNoteEditor('actual', selectedCalDate, +el.dataset.i);
});

function hasPlan(mat){ return Number.isFinite(Number(mat.startPage)) && Number(mat.startPage)>=1 && Number.isFinite(Number(mat.endPage)) && Number(mat.endPage)>=Number(mat.startPage) && /^\d{4}-\d{2}-\d{2}$/.test(mat.startDate||'') && /^\d{4}-\d{2}-\d{2}$/.test(mat.endDate||'') && mat.endDate>=mat.startDate; }
function matPeriodDays(mat){ return Math.max(1,diffDays(mat.startDate, mat.endDate)+1); }
function matTotalUnits(mat){ return mat.endPage - mat.startPage + 1; }
function matPer(mat){ return Math.ceil(matTotalUnits(mat)/matPeriodDays(mat)); }
function newRangeForDay(mat, dayIdx){
  const per = matPer(mat);
  const start = mat.startPage + dayIdx*per;
  if(start>mat.endPage) return null;
  return [start, Math.min(mat.endPage, start+per-1)];
}
// その日最初に見たときの進捗(doneUpTo)を「今日の起点」として1回だけ記録しておく。
// 同じ日のうちに進捗を記録・編集しても、今日の目安はこの起点から動かさない（＝完了していれば「完了」表示になる）。
function ensureAllMatBaselines(){
  const tk = todayKey();
  let changed=false;
  DB.materials.forEach(mat=>{
    if(hasPlan(mat) && mat.baselineDate!==tk){
      mat.baselineDate = tk;
      mat.baselineDone = mat.doneUpTo ? mat.doneUpTo : mat.startPage-1;
      changed=true;
    }
  });
  if(changed) saveDB();
}
function todaysPlanFor(mat, todayK){
  const idx = diffDays(mat.startDate, todayK);
  if(idx<0) return {newR:null, reviews:[], todayDone:false};
  const periodDays = matPeriodDays(mat);
  // 「今日の新規」は、その日最初に見たときの起点(baselineDone)を使って
  // 残りページ数 ÷ 残り日数 で計算する。今日の記録を編集しても目安は動かず、
  // 目安まで終わっていれば「完了」として扱う。
  const baselineDone = (mat.baselineDate===todayK) ? mat.baselineDone : (mat.doneUpTo ? mat.doneUpTo : mat.startPage-1);
  let newR = null;
  if(baselineDone < mat.endPage){
    const remainingUnits = mat.endPage - baselineDone;
    const remainingDays = Math.max(1, periodDays - idx);
    const per = Math.ceil(remainingUnits/remainingDays);
    const start = baselineDone+1;
    newR = [start, Math.min(mat.endPage, start+per-1)];
  }
  const currentDone = mat.doneUpTo ? mat.doneUpTo : mat.startPage-1;
  const todayDone = newR ? currentDone >= newR[1] : (baselineDone>=mat.endPage);
  if(mat.planMode==='pace') return {newR, reviews:[], todayDone};
  const reviews=[];
  const maxPast = Math.min(idx, periodDays-1);
  for(let d=0; d<=maxPast; d++){
    const learnDate = addDays(mat.startDate, d);
    const gap = diffDays(learnDate, todayK);
    if(REVIEW_DAYS.includes(gap)){
      const r = newRangeForDay(mat, d);
      if(r) reviews.push({range:r, gap});
    }
  }
  return {newR, reviews, todayDone};
}
function materialsDueCount(){
  const tk=todayKey(); let n=0;
  DB.materials.forEach(mat=>{
    if(!hasPlan(mat)) return;
    const {newR, reviews, todayDone} = todaysPlanFor(mat, tk);
    if((newR && !todayDone) || reviews.length) n++;
  });
  return n;
}
function updateMatBadge(){
  ensureAllMatBaselines();
  document.getElementById('matBadge').style.display = materialsDueCount()>0 ? 'block' : 'none';
}
function renderMaterials(){
  ensureAllMatBaselines();
  const tk = todayKey();
  const el=document.getElementById('matList');
  el.innerHTML = DB.materials.map(mat=>{
    const sc = subjOf(mat.subjectId).color;
    const actions = `<div style="display:flex; align-items:center; gap:8px;"><span class="small">${escapeHtml(String(subjOf(mat.subjectId).name))}</span><div class="iconDel" data-edit="${mat.id}" style="color:#3b82f6;">✎</div><div class="iconDel" data-del="${mat.id}">🗑</div></div>`;
    if(!hasPlan(mat)){
      return `<div class="matCard" style="border-color:${sc}">
        <div class="rowBetween"><b>${escapeHtml(String(mat.name||''))}</b>${actions}</div>
        <div class="small" style="margin-top:6px;">ページ・日付が未設定です（学習計画なし）</div>
      </div>`;
    }
    const per = matPer(mat), total = matTotalUnits(mat);
    const doneCount = mat.doneUpTo ? Math.max(0, Math.min(total, mat.doneUpTo - mat.startPage + 1)) : 0;
    const pct = Math.round(doneCount/total*100);
    const {newR, reviews, todayDone} = todaysPlanFor(mat, tk);
    const modeTag = mat.planMode==='pace' ? '・通しで1周' : '・忘却曲線で復習';
    const doneText = mat.doneUpTo ? `p${mat.doneUpTo}まで完了` : 'まだ記録なし';
    const newRLine = newR
      ? (todayDone
          ? `<div style="margin-top:8px; font-size:13px; color:#22c55e;">✅ 今日の分は完了しました</div>`
          : `<div style="margin-top:8px; font-size:13px;">📖 今日の新規（予定）: p${newR[0]}〜p${newR[1]}</div>`)
      : '';
    return `<div class="matCard" data-mid="${mat.id}" style="border-color:${sc}">
      <div class="rowBetween"><b>${escapeHtml(String(mat.name||''))}</b><div style="display:flex; align-items:center; gap:8px;"><span class="small">${escapeHtml(String(subjOf(mat.subjectId).name))}${modeTag}</span><div class="iconDel" data-edit="${mat.id}" style="color:#3b82f6;">✎</div><div class="iconDel" data-del="${mat.id}">🗑</div></div></div>
      <div class="small" style="margin-top:4px;">p${mat.startPage}〜p${mat.endPage} ／ ${mat.startDate}〜${mat.endDate}</div>
      <div class="matProg"><div class="matProgFg" style="width:${pct}%;background:${sc}"></div></div>
      <div class="small" style="margin-top:6px;">実績 ${pct}%（${doneText} ／ 1日目安 ${per}）</div>
      ${newRLine}
      ${reviews.map(r=>`<div style="font-size:13px; color:${sc};">🔁 復習(${r.gap}日前分): p${r.range[0]}〜p${r.range[1]}</div>`).join('')}
      <div class="small" style="margin-top:8px; text-align:right;">タップして進捗を記録 ▸</div>
    </div>`;
  }).join('') || `<div class="small" style="padding:0 4px;">教材を追加すると学習計画が表示されます</div>`;
 
  el.querySelectorAll('.matCard[data-mid]').forEach(card=>{
    card.style.cursor='pointer';
    card.onclick=(e)=>{
      if(e.target.closest('.iconDel')) return;
      const mat = DB.materials.find(m=>m.id===Number(card.dataset.mid));
      if(mat) openProgressModal(mat);
    };
  });
  el.querySelectorAll('[data-edit]').forEach(x=>x.onclick=(e)=>{
    e.stopPropagation();
    const mat = DB.materials.find(m=>m.id===Number(x.dataset.edit));
    if(mat) openMatEdit(mat);
  });
  el.querySelectorAll('[data-del]').forEach(x=>x.onclick=(e)=>{
    e.stopPropagation();
    const idx = DB.materials.findIndex(m=>m.id===Number(x.dataset.del));
    if(idx<0) return;
    deleteWithUndo(DB.materials, idx, {renderFns:[renderMaterials], msg:'教材を削除しました'});
  });
  updateMatBadge();
}

let progMatId=null;
function saveProgress(page){
  const mat = DB.materials.find(m=>m.id===progMatId);
  if(!mat) return;
  const value=Number(page); if(!Number.isFinite(value)) return;
  const p = Math.max(Number(mat.startPage)-1, Math.min(Number(mat.endPage), Math.round(value)));
  mat.doneUpTo = p;
  saveDB();
  closeModal('progressModalBg');
  toast('進捗を記録しました');
  renderMaterials();
}
function openProgressModal(mat){
  progMatId = mat.id;
  const total = matTotalUnits(mat);
  const done = mat.doneUpTo ? Math.max(0, mat.doneUpTo - mat.startPage + 1) : 0;
  document.getElementById('progModalTitle').textContent = `${mat.name} の進捗`;
  document.getElementById('progModalStatus').textContent = mat.doneUpTo ? `p${mat.doneUpTo}まで完了（${done}/${total}）` : `まだ記録がありません（0/${total}）`;
  const savedPage=Number(mat.doneUpTo);
  const initialPage = Number.isFinite(savedPage) && savedPage>=mat.startPage ? Math.min(savedPage,mat.endPage) : mat.startPage;
  buildNumWheel(document.getElementById('wheelProgPage'), mat.startPage, mat.endPage, initialPage, false);
  openModal('progressModalBg');
}

  if(allFilled && (epRaw < spRaw || end < start)){ toast('入力内容を確認してください'); return; }
  const data = { subjectId, name,
    startPage: allFilled? spRaw : null, endPage: allFilled? epRaw : null,
    startDate: allFilled? start : null, endDate: allFilled? end : null,
    planMode: allFilled? matPlanMode : null };
  if(editingMatId){
    const m = DB.materials.find(x=>x.id===editingMatId);

    toast('教材を更新しました');
  } else {
    DB.materials.push({id:Date.now(), doneUpTo:null, ...data});
    toast('教材を追加しました');

  saveDB();
  editingMatId=null;
  document.getElementById('matName').value='';

function renderSubjList(){
  const el=document.getElementById('subjList');
  el.innerHTML = `<div class="small" style="margin-bottom:6px;">固定教科</div>` +
    FIXED_SUBJECTS.map(s=>`<div class="subjRow"><div class="subjDot" style="background:${s.color}"></div><div style="flex:1;">${escapeHtml(s.name)}</div></div>`).join('') +
    (DB.customSubjects.length? `<div class="small" style="margin:10px 0 6px;">追加した教科</div>` +
      DB.customSubjects.map(s=>`<div class="subjRow"><div class="subjDot" style="background:${s.color}"></div><div style="flex:1;">${escapeHtml(s.name)}</div><div class="iconDel" data-csid="${s.id}">✕</div></div>`).join('') : '');
  el.querySelectorAll('[data-csid]').forEach(x=>x.onclick=()=>{
    const csid=x.dataset.csid;
    const subjName = (DB.customSubjects.find(s=>s.id===csid)||{}).name || '';
    const sessCount = DB.sessions.filter(s=>s.subjectId===csid).length;
    const matCount = DB.materials.filter(m=>m.subjectId===csid).length;
    let planCount=0;
    Object.values(DB.dayPlans).forEach(blocks=>{ blocks.forEach(b=>{ if(b.subj===csid) planCount++; }); });
    const affected = sessCount+matCount+planCount;
    const msg = affected>0
      ? `「${subjName}」を削除すると、記録${sessCount}件・教材${matCount}件・予定${planCount}件が「まとめて」に変わります。削除しますか？`
      : `「${subjName}」を削除しますか？`;
    if(!confirm(msg)) return;
    DB.customSubjects = DB.customSubjects.filter(s=>s.id!=csid);
    DB.sessions.forEach(s=>{ if(s.subjectId===csid) s.subjectId='all'; });
    DB.materials.forEach(m=>{ if(m.subjectId===csid) m.subjectId='all'; });
    Object.values(DB.dayPlans).forEach(blocks=>{ blocks.forEach(b=>{ if(b.subj===csid) b.subj='all'; }); });
    if(paintSubject===csid) paintSubject='all';
    invalidateSessionsCache();
    saveDB(); renderSubjList();
    toast('教科を削除しました');
  });
}
